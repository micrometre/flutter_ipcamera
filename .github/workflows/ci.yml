name: Flutter IP Camera CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Configs & Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts syntax
        run: |
          bash -n run_avd.sh create_avd.sh

      - name: Validate pubspec.yaml & AndroidManifest.xml
        run: |
          python3 - << 'PY'
          import xml.etree.ElementTree as ET
          import yaml

          # 1. Validate pubspec.yaml
          with open("pubspec.yaml", "r", encoding="utf-8") as f:
              pubspec = yaml.safe_load(f)
          assert "name" in pubspec and "version" in pubspec, "Missing name/version in pubspec.yaml"
          print(f"✓ Valid pubspec.yaml: {pubspec['name']} v{pubspec['version']}")

          # 2. Validate AndroidManifest.xml
          ET.parse("android/app/src/main/AndroidManifest.xml")
          print("✓ Valid XML: android/app/src/main/AndroidManifest.xml")
          PY

  flutter-check:
    name: Flutter Format & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter toolchain
        run: |
          flutter --version

      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Run Flutter static analysis
        run: |
          flutter analyze --no-fatal-infos

      - name: Run Flutter tests
        run: |
          flutter test --reporter expanded

  build-android:
    name: Build & Release Android APK
    needs: [validate, flutter-check]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release

      - name: Publish Android APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_FILE="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "${APK_FILE}" ]; then
            echo "Error: APK file not found at ${APK_FILE}" >&2
            exit 1
          fi

          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            TAG_NAME="v${VERSION}"
          fi
          ASSET_NAME="flutter-ipcamera_${VERSION}_release.apk"
          cp "${APK_FILE}" "${ASSET_NAME}"

          echo "Publishing ${ASSET_NAME} to GitHub Release ${TAG_NAME}..."
          if ! gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            gh release create "${TAG_NAME}" "${ASSET_NAME}" \
              --target "${GITHUB_SHA}" \
              --title "Flutter IP Camera ${TAG_NAME}" \
              --notes "Automated Android APK release build from commit ${GITHUB_SHA}."
          else
            gh release upload "${TAG_NAME}" "${ASSET_NAME}" --clobber
          fi
          echo "✓ Successfully published ${ASSET_NAME} to GitHub Release ${TAG_NAME}"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ipcamera-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
